[package]
name = "docs-render-wasm"
# The npm package @dire-kiwi/docs-render takes its version from here; release tags are `render-v<version>`.
version = "0.1.0"
description = "WebAssembly bindings for docs-render (npm: @dire-kiwi/docs-render)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
docs-render = { workspace = true }
js-sys = "0.3.107"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.130"
